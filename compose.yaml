name: cositadezacatlan

services:
  # Database Service: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: zacatlan_postgres
    restart: always
    environment:
      POSTGRES_DB: zacatlan_db
      POSTGRES_USER: zacatlan_admin
      POSTGRES_PASSWORD: ZacatlanPass2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zacatlan_admin -d zacatlan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Administration GUI (Optional)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: zacatlan_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unacositadezacatlan.com
      PGADMIN_DEFAULT_PASSWORD: AdminZacatlan2026!
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
