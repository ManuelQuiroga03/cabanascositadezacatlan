name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/backend/CositadeZacatlan.slnx

      - name: Build Solution
        run: dotnet build src/backend/CositadeZacatlan.slnx --configuration Release --no-restore

      - name: Run xUnit Unit Tests
        run: dotnet test tests/CositadeZacatlan.UnitTests/CositadeZacatlan.UnitTests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: src/frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: src/frontend
        run: npm run build
